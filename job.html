<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הגש מועמדות</title>
<style>
  :root {
    --cyan: #0891b2;
    --cyan-dark: #0e7490;
    --amber: #d97706;
    --gray-400: #9ca3af;
    --gray-900: #111827;
    --gray-700: #374151;
    --gray-600: #4b5563;
    --gray-500: #6b7280;
    --gray-300: #d1d5db;
    --gray-200: #e5e7eb;
    --gray-100: #f3f4f6;
    --gray-50: #f8fafc;
    --success-bg: #eefbf3;
    --success-border: #9ae6b4;
    --success-text: #166534;
    --error-bg: #fef2f2;
    --error-border: #fca5a5;
    --error-text: #991b1b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(to bottom right, var(--gray-50), #fef3c7);
    color: var(--gray-900);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .modal-page {
    min-height: auto;
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 24px 0;
  }

  .modal {
    background: white;
    border-radius: 16px;
    width: 1000px;
    max-width: 95vw;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
    display: grid;
    grid-template-columns: 1fr 350px;
  }

  .modal-main {
    padding: 24px;
    height: 100%;
  }

  .modal-sidebar {
    background: #f9fafb;
    border-left: 1px solid #e5e7eb;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    height: 100%;
  }

  .modal-header {
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid #e5e7eb;
  }

  .modal-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .modal h2 {
    font-size: 28px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 12px;
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .modal-section {
    margin-bottom: 28px;
  }

  .modal-section h3 {
    font-size: 18px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid #e5e7eb;
  }

  .modal-section p {
    font-size: 15px;
    color: var(--gray-700);
    line-height: 1.7;
    margin: 0;
  }

  .questions-section {
    margin-top: 32px;
  }

  .question-item {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
    border-right: 4px solid var(--gray-300);
  }

  .question-item.required {
    border-right-color: #dc2626;
    background: #fee2e2;
    border-right-width: 6px;
  }

  .question-item.optional {
    border-right-color: #6b7280;
  }

  .question-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .question-label.required {
    background: #fee2e2;
    color: #991b1b;
  }

  .question-label.optional {
    background: #f3f4f6;
    color: #4b5563;
  }

  .question-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-900);
    line-height: 1.6;
    word-wrap: break-word;
    white-space: normal;
  }

  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    text-decoration: none;
  }

  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--gray-300);
    color: var(--gray-700);
  }

  .btn-outline:hover {
    background: var(--gray-100);
  }

  .btn-primary {
    background: var(--cyan);
    color: white;
  }

  .btn-primary:hover {
    background: var(--cyan-dark);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }

  .badge-hot   { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
  .badge-quick { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .badge-sticky { background: #fef9c3; color: #854d0e; border: 1px solid #fde68a; }
  .badge-job-num {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 3px 8px;
    font-family: monospace;
    line-height: 1.15;
  }
  .badge-category {
    background: #ecfeff;
    color: #155e75;
    border: 1px solid #a5f3fc;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.15;
    white-space: nowrap;
  }

  .modal {
    background: linear-gradient(135deg, #f9fafb 0%, #ecfeff 100%);
    border: 1px solid rgba(255, 255, 255, 0.94);
    box-shadow: 0 28px 60px rgba(8, 145, 178, 0.14);
  }

  .modal-main {
    background: transparent;
  }

  .modal-sidebar {
    background: transparent;
    border-left-color: rgba(8, 145, 178, 0.12);
  }

  .modal-header,
  .modal-section {
    background: #ffffff;
    border: 0;
    border-radius: 12px;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    padding: 24px;
  }

  .modal-section h3 {
    border-bottom-color: #e5e7eb;
  }

  .modal h2 {
    font-size: 24px;
    line-height: 1.28;
  }

  .modal-meta,
  .meta-row {
    font-size: 13px;
  }

  .modal-section h3 {
    font-size: 16px;
    margin-bottom: 12px;
  }

  .modal-section p,
  .modal-section li,
  .modal-section .job-description-text {
    font-size: 14px;
    line-height: 1.7;
  }

  .modal .badge {
    font-size: 11px;
  }

  .modal-badges .badge {
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    color: #4b5563;
    padding: 3px 8px;
    line-height: 1.15;
    box-shadow: none;
  }

  .modal-badges .badge-category {
    background: #ecfeff;
    border-color: #a5f3fc;
    color: #155e75;
    border-radius: 6px;
    padding: 3px 8px;
    line-height: 1.15;
  }

  .modal-badges .badge-hot {
    background: #fff7ed;
    border-color: #fed7aa;
    color: #c2410c;
  }

  .modal-badges .badge-quick {
    background: #dcfce7;
    border-color: #bbf7d0;
    color: #15803d;
  }

  .modal-badges .badge-sticky {
    background: #fef9c3;
    border-color: #fde68a;
    color: #854d0e;
  }

  .modal-badges .badge-job-num {
    background: #f3f4f6;
    border-color: #e5e7eb;
    border-radius: 6px;
    color: #374151;
    padding: 3px 8px;
    line-height: 1.15;
  }

  .meta-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; color: var(--gray-600); font-size: 14px; margin-top: 12px; }
  .meta-item { display: flex; align-items: center; gap: 5px; }
  .meta-item strong { color: var(--gray-900); }

  .apply-card { background: white; border-radius: 12px; border: 1px solid #e5e7eb; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .apply-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #f3f4f6;
  }
  .apply-card-title { font-size: 16px; font-weight: 700; color: var(--gray-900); margin: 0; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
  .form-required { color: #ef4444; margin-right: 2px; }
  .form-input { border: 1px solid #e5e7eb; border-radius: 8px; padding: 9px 12px; font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s; font-family: inherit; width: 100%; background: white; }
  .form-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(8,145,178,.1); }
  textarea.form-input { resize: vertical; min-height: 70px; }
  .inline-note { background:#fef3c7;color:#92400e;font-size:12px;padding:0 4px;display:inline;border-radius:3px; }

  .cv-upload-zone { border: 2px dashed #d1d5db; border-radius: 10px; padding: 18px 14px; text-align: center; cursor: pointer; transition: all .2s; user-select: none; }
  .cv-upload-zone:hover, .cv-upload-zone.drag-over { border-color: var(--cyan); background: #f0fdff; }
  .cv-upload-zone.has-file { border-color: #10b981; background: #f0fdf4; }
  .cv-upload-zone input[type=file] { display: none; }
  .cv-upload-icon { font-size: 24px; display: block; margin-bottom: 6px; }
  .cv-upload-label { font-size: 12px; color: var(--gray-500); line-height: 1.6; }
  .cv-upload-filename { font-size: 12px; color: #10b981; font-weight: 600; }

  .form-alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; align-items: flex-start; gap: 8px; }
  .form-alert.show { display: flex; }
  .form-alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .form-alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

  .info-card { background: var(--gray-50); border-radius: 10px; border: 1px solid #e5e7eb; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .info-card-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--gray-500); margin-bottom: 2px; }
  .info-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gray-700); }
  .info-row strong { color: var(--gray-900); font-weight: 600; }

  .header-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .header-top-row .btn,
  .apply-card-head .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    padding: 8px 14px;
    font-size: 13px;
    line-height: 1.15;
    white-space: nowrap;
  }

  .subtle-back-link,
  .subtle-action-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--gray-500);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.18s ease;
  }

  .subtle-action-link {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 0;
    font-family: inherit;
    cursor: pointer;
  }

  .subtle-back-link:hover,
  .subtle-action-link:hover {
    color: var(--cyan-dark);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .subtle-back-link:focus-visible,
  .subtle-action-link:focus-visible {
    outline: 2px solid #a5f3fc;
    outline-offset: 4px;
    border-radius: 6px;
  }

  .resume-notice {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid #bbf7d0;
    border-radius: 12px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.7;
  }

  .notice {
    border-radius: 8px;
    padding: 12px;
  }

  .loading, .empty-state {
    padding: 48px 20px;
    text-align: center;
    color: var(--gray-600);
  }

  .inactive-job-shell {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
    gap: 20px;
    width: 100%;
  }

  .inactive-job-main,
  .inactive-job-side {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    padding: 28px;
  }

  .inactive-job-main {
    display: flex;
    flex-direction: column;
    gap: 18px;
    justify-content: center;
  }

  .inactive-job-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid #bae6fd;
    background: #f0f9ff;
    color: var(--cyan-dark);
    font-size: 12px;
    font-weight: 700;
  }

  .inactive-job-title {
    font-size: clamp(28px, 4.2vw, 38px);
    line-height: 1.15;
    color: var(--gray-900);
    margin: 0;
  }

  .inactive-job-copy {
    font-size: 16px;
    line-height: 1.9;
    color: var(--gray-600);
    max-width: 44ch;
  }

  .inactive-job-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 4px;
  }

  .inactive-job-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 46px;
    padding: 12px 20px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--cyan), var(--cyan-dark));
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 18px 30px rgba(8, 145, 178, 0.22);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .inactive-job-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 22px 34px rgba(8, 145, 178, 0.28);
  }

  .inactive-job-side {
    background: linear-gradient(180deg, #f9fafb 0%, #eff9f7 100%);
    border: 1px solid rgba(8, 145, 178, 0.1);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .inactive-job-side-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--gray-900);
  }

  .inactive-job-side-copy {
    color: var(--gray-600);
    font-size: 14px;
    line-height: 1.8;
  }

  .inactive-job-list {
    display: grid;
    gap: 10px;
    padding: 0;
    margin: 0;
    list-style: none;
  }

  .inactive-job-list li {
    background: rgba(255,255,255,0.86);
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--gray-700);
    font-size: 14px;
    line-height: 1.7;
  }

  .job-loader-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at top, rgba(255,255,255,0.92), rgba(239,248,246,0.98)),
      linear-gradient(135deg, #eff9f7 0%, #fff8ec 100%);
    transition: opacity .45s ease, visibility .45s ease;
  }

  .job-loader-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .job-loader-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
  }

  .job-loader-figure {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(42vw, 320px);
    aspect-ratio: 1;
    animation: loader-float 3.2s ease-in-out infinite;
  }

  .job-loader-figure::before {
    content: '';
    position: absolute;
    inset: 72% 12% -5% 12%;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(15, 90, 96, 0.18), rgba(15, 90, 96, 0));
    filter: blur(16px);
    opacity: 0.8;
    animation: loader-shadow 3.2s ease-in-out infinite;
  }

  .job-loader-figure::after {
    content: '';
    position: absolute;
    inset: 8%;
    border-radius: 42px;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.7), rgba(255,255,255,0));
    filter: blur(18px);
    opacity: 0.55;
    pointer-events: none;
  }

  .job-loader-image {
    position: relative;
    z-index: 2;
    width: 100%;
    height: auto;
    object-fit: contain;
    display: flex;
    filter: drop-shadow(0 22px 36px rgba(15, 90, 96, 0.16));
  }

  .job-loader-echo {
    position: absolute;
    inset: 15%;
    border-radius: 42px;
    box-shadow: 0 0 0 0 rgba(8, 145, 178, 0.16);
    animation: loader-echo 3.2s ease-out infinite;
  }

  .job-loader-copy {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }

  .job-loader-title {
    font-size: 18px;
    font-weight: 800;
    color: #164e63;
  }

  .job-loader-subtitle {
    font-size: 14px;
    color: var(--gray-500);
  }

  .job-loader-dots {
    display: inline-flex;
    gap: 8px;
    margin-top: 4px;
  }

  .job-loader-dot {
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: #0f5a60;
    animation: loader-dot 1.2s ease-in-out infinite;
  }

  .job-loader-dot:nth-child(2) { animation-delay: 0.16s; }
  .job-loader-dot:nth-child(3) { animation-delay: 0.32s; }

  @keyframes loader-float {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(-1deg) scale(1); }
    50% { transform: translate3d(0, -10px, 0) rotate(1.5deg) scale(1.02); }
  }

  @keyframes loader-shadow {
    0%, 100% { transform: scale(1); opacity: 0.45; }
    50% { transform: scale(0.88); opacity: 0.28; }
  }

  @keyframes loader-echo {
    0% { box-shadow: 0 0 0 0 rgba(8, 145, 178, 0.14); opacity: 0.9; }
    70% { box-shadow: 0 0 0 22px rgba(8, 145, 178, 0); opacity: 0.14; }
    100% { box-shadow: 0 0 0 0 rgba(8, 145, 178, 0); opacity: 0; }
  }

  @keyframes loader-dot {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .job-loader-figure,
    .job-loader-figure::before,
    .job-loader-echo,
    .job-loader-dot {
      animation: none;
    }
  }

  .scroll-top-btn {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 56px;
    height: 56px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--cyan), var(--cyan-dark));
    color: white;
    box-shadow: 0 18px 30px rgba(8, 145, 178, 0.24);
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(14px) scale(0.92);
    transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease, box-shadow 0.22s ease;
    z-index: 90;
  }

  .scroll-top-btn:hover {
    box-shadow: 0 24px 36px rgba(8, 145, 178, 0.28);
    transform: translateY(-2px) scale(1);
  }

  .scroll-top-btn.is-visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0) scale(1);
  }

  .scroll-top-btn:focus-visible {
    outline: 3px solid rgba(255,255,255,0.85);
    outline-offset: 3px;
  }

  .job-footer {
    margin-top: 24px;
    background: rgba(255, 255, 255, 0.8);
    border-top: 1px solid rgba(229, 231, 235, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .job-footer-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
  }

  .job-footer-logo {
    display: block;
    width: 44px;
    height: 44px;
    object-fit: contain;
    flex: 0 0 auto;
    -webkit-transform: translate3d(0, 0, 0);
    transform: translate3d(0, 0, 0);
    -webkit-animation: job-footer-logo-sway 5.4s ease-in-out infinite;
    animation: job-footer-logo-sway 5.4s ease-in-out infinite;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    will-change: transform;
  }

  @-webkit-keyframes job-footer-logo-sway {
    0%, 100% {
      -webkit-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
    }
    35% {
      -webkit-transform: translate3d(4px, 0, 0);
      transform: translate3d(4px, 0, 0);
    }
    70% {
      -webkit-transform: translate3d(-3px, 0, 0);
      transform: translate3d(-3px, 0, 0);
    }
  }

  @keyframes job-footer-logo-sway {
    0%, 100% {

<script>
const API = `${window.location.origin}/api`;

let loaderHideTimer = null;
let pendingCvPickerSync = false;
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function setupIOSBrandIconSway(selector) {
  const isIOS = /iPad|iPhone|iPod|CriOS|FxiOS|EdgiOS/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!isIOS) return;

  const icons = Array.from(document.querySelectorAll(selector))
    .filter((icon) => icon.dataset.iosSwayActive !== '1');
  if (!icons.length) return;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let frameId = null;

  const stop = () => {
    if (frameId !== null) {
      cancelAnimationFrame(frameId);
      frameId = null;
    }
    icons.forEach((icon) => {
      icon.dataset.iosSwayActive = '';
      icon.style.left = '';
      icon.style.position = '';
    });
  };

  const start = () => {
    stop();
    if (reducedMotion.matches) return;

    icons.forEach((icon) => {
      icon.dataset.iosSwayActive = '1';
      icon.style.webkitAnimation = 'none';
      icon.style.animation = 'none';
      icon.style.webkitTransform = 'none';
      icon.style.transform = 'none';
      icon.style.position = 'relative';
      icon.style.left = '0px';
    });

    const startedAt = performance.now();
    const tick = (now) => {
      const phase = ((now - startedAt) / 5400) * Math.PI * 2;
      const x = Math.sin(phase) * 8;
      icons.forEach((icon) => {
        icon.style.left = `${x.toFixed(2)}px`;
      });
      frameId = requestAnimationFrame(tick);
    };

    frameId = requestAnimationFrame(tick);
  };

  if (typeof reducedMotion.addEventListener === 'function') {
    reducedMotion.addEventListener('change', start);
  } else if (typeof reducedMotion.addListener === 'function') {
    reducedMotion.addListener(start);
  }
  window.addEventListener('pagehide', stop);
  start();
}

async function shareCurrentJob() {
  const shareButton = document.getElementById('share-btn');
  const shareData = {
    title: document.title,
    text: currentJob?.title || 'משרה',
    url: window.location.href,
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else {
      await navigator.clipboard.writeText(window.location.href);
      if (shareButton) {
        shareButton.textContent = 'הקישור הועתק';
        setTimeout(() => {
          shareButton.textContent = 'שיתוף';
        }, 1500);
      }
    }
  } catch (error) {
    // User cancelled or share unavailable; keep the UI unchanged.
  }
}

function escHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

`;

function splitField(val) {
  if (!val) return [];
  try {
    const parsed = JSON.parse(val);
    return Array.isArray(parsed) ? parsed.map(v => String(v).trim()).filter(Boolean) : [String(parsed).trim()];
  } catch (error) {
    return String(val).split(',').map(v => v.trim()).filter(Boolean);
  }
}

function shouldRenderInactiveJobState(error, responseStatus, result) {
  if (Number(responseStatus || 0) === 404) return true;
  const code = String(result?.code || '').trim();
  if (code === 'JOB_INACTIVE_OR_NOT_FOUND') return true;
  const message = String(error?.message || result?.message || '').trim();
  return /job not found|המשרה לא נמצאה|המשרה כבר לא פעילה|לא פעילה|inactive/i.test(message);
}

function showJobLoader(title = 'מעלים את המשרה', subtitle = 'רק עוד רגע ואנחנו בפנים') {
  const loaderEl = document.getElementById('job-loader-overlay');
  const titleEl = document.getElementById('job-loader-title');
  const subtitleEl = document.getElementById('job-loader-subtitle');
  if (!loaderEl) return;
  if (loaderHideTimer) {
    window.clearTimeout(loaderHideTimer);
    loaderHideTimer = null;
  }
  if (titleEl) titleEl.textContent = title;
  if (subtitleEl) subtitleEl.textContent = subtitle;
  loaderShownAt = Date.now();
  loaderEl.classList.remove('hidden');
}

function hideJobLoader() {
  const loaderEl = document.getElementById('job-loader-overlay');
  if (!loaderEl) return;
  const elapsed = Date.now() - loaderShownAt;
  const waitMs = Math.max(0, 800 - elapsed);
  loaderHideTimer = window.setTimeout(() => {
    loaderEl.classList.add('hidden');
    loaderHideTimer = null;
  }, waitMs);
}

function renderJob(job) {
  currentJob = job;
  document.title = `${job.title} | הגש מועמדות`;

  let embeds = {};
  try {
    embeds = job.embedding_statements ? JSON.parse(job.embedding_statements) : {};
  } catch (error) {}

  const badges = [];
  if (job.category) badges.push(`<span class="badge badge-category">${escHtml(job.category)}</span>`);
  if (job.job_number) badges.push(`<span class="badge badge-job-num">#${escHtml(job.job_number)}</span>`);
  if (job.is_hot) badges.push('<span class="badge badge-hot">🔥 חם</span>');
  if (job.is_sticky) badges.push('<span class="badge badge-sticky">📌 מובטח</span>');

  const meta = [];
  if (job.location) meta.push(`<div class="meta-item">📍 <span>${escHtml(job.location)}</span></div>`);
  if (job.job_type) meta.push(`<div class="meta-item">💼 <span>${escHtml(job.job_type)}</span></div>`);
  if (job.job_role) meta.push(`<div class="meta-item">🧩 <span>${escHtml(job.job_role)}</span></div>`);
  if (job.scope) meta.push(`<div class="meta-item">⏰ <span>${escHtml(job.scope)}</span></div>`);
  if (job.internal_salary) meta.push(`<div class="meta-item">💰 <span>${escHtml(job.internal_salary)}</span></div>`);

  let requirementsHtml = '';

  if (embeds.validThrough) {
    requirementsHtml += `
      <div class="modal-section">
        <div class="notice" style="margin:0;background:#fffbeb;border:1px solid #fde68a;color:#92400e">
          ⏳ תוקף המשרה עד <strong>${escHtml(embeds.validThrough)}</strong>
        </div>
      </div>
    `;
  }

  document.getElementById('modal-badges').innerHTML = badges.join('');
  document.getElementById('modal-title').innerHTML = `${escHtml(job.title)}${job.is_hot ? ' <span style="color:#f97316">🔥</span>' : ''}`;
  document.getElementById('modal-meta').innerHTML = meta.join('');
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-section">
      <h3>תיאור המשרה</h3>
      <div class="job-description-text" style="color:var(--gray-700);white-space:pre-wrap;">${escHtml(job.description || '–')}</div>
    </div>
    ${requirementsHtml}
  `;

  renderSidebar(job);
  hideJobLoader();
}

function buildScreeningQuestions(job) {
  if (!job.screening_questions) return '';
  let questions = [];
  try {
    questions = JSON.parse(job.screening_questions);
  } catch (error) {}

  if (!Array.isArray(questions) || questions.length === 0) return '';

  return questions.map((question, index) => {
    const text = typeof question === 'string' ? question : (question.text || '');
    const required = typeof question === 'object' ? question.required !== false : true;
    return `
      <div class="form-group">
        <label class="form-label">
          ${escHtml(text)}
          ${required ? '<span class="inline-note">דרישת חובה למשרה</span>' : ''}
          <span class="form-required">*</span>
        </label>
        <textarea class="form-input screening-answer" rows="2" data-question-index="${index}" placeholder="תשובתך..."></textarea>
      </div>
    `;
  }).join('');
}

function renderSidebar(job) {
  const screeningQuestionsHtml = buildScreeningQuestions(job);
  const noResumeNotice = noResumeMode ? `
    <div class="resume-notice">
      ✓ קורות החיים שלך נמצאים במערכת - אין צורך להעלות קורות חיים
    </div>
  ` : '';
  const uploadSection = noResumeMode ? '' : `
    <div class="form-group">
      <label class="form-label">קורות חיים<span class="form-required">*</span></label>
      <div class="cv-upload-zone" id="cv-zone"
        onclick="openCvPicker()"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="handleCvDrop(event)">
        <span class="cv-upload-icon">📎</span>
        <div class="cv-upload-label" id="cv-label">
          ${CV_EMPTY_LABEL_HTML}
        </div>
        <input type="file" id="cv-file" accept=".pdf,.doc,.docx" onchange="handleCvSelect(event)">
      </div>
    </div>
  `;

  document.getElementById('modal-sidebar').innerHTML = `
    <div class="apply-card">
      <div class="apply-card-head">
        <div class="apply-card-title">הגש מועמדות</div>
        <button class="subtle-action-link" id="share-btn" type="button" onclick="shareCurrentJob()">שיתוף</button>
      </div>

      ${noResumeNotice}

      <div class="form-group">
        <label class="form-label">שם מלא <span class="form-required">*</span></label>
        <input type="text" class="form-input" id="apply-name" placeholder="ישראל ישראלי">
      </div>
      <div class="form-group">
        <label class="form-label">אימייל <span class="form-required">*</span></label>
        <input type="email" class="form-input" id="apply-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">טלפון <span class="form-required">*</span></label>
        <input type="tel" class="form-input" id="apply-phone" placeholder="050-0000000">
      </div>

      ${screeningQuestionsHtml}
      ${uploadSection}

      <div class="form-alert form-alert-error" id="apply-error">⚠️ <span id="apply-error-text"></span></div>
      <div class="form-alert form-alert-success" id="apply-success">✅ <span id="apply-success-text"></span></div>

      <button class="btn btn-primary" id="apply-btn" onclick="submitApplication()">שלח מועמדות →</button>
    </div>
  `;
}

function showApplyError(message) {
  const errorEl = document.getElementById('apply-error');
  const errorText = document.getElementById('apply-error-text');
  const successEl = document.getElementById('apply-success');
  if (successEl) successEl.classList.remove('show');
  if (errorText) errorText.textContent = message;
  if (errorEl) errorEl.classList.add('show');
}

function showApplySuccess(message) {
  const errorEl = document.getElementById('apply-error');
  const successEl = document.getElementById('apply-success');
  const successText = document.getElementById('apply-success-text');
  if (errorEl) errorEl.classList.remove('show');
  if (successText) successText.textContent = message;
  if (successEl) successEl.classList.add('show');
}

function validateResumeFile(file) {
  if (!file) return 'נא לצרף קורות חיים';
  const allowedExtensions = ['pdf', 'doc', 'docx'];
  const ext = file.name.split('.').pop()?.toLowerCase();
  if (!allowedExtensions.includes(ext)) {
    return 'ניתן להעלות רק קובץ PDF, DOC או DOCX';
  }
  if (file.size > 4 * 1024 * 1024) {
    return 'גודל הקובץ המקסימלי הוא 4MB';
  }
  return '';
}

function resetCvFileUi() {
  const zone = document.getElementById('cv-zone');
  const label = document.getElementById('cv-label');
  if (!zone || !label) return;
  zone.classList.remove('has-file');
  label.innerHTML = CV_EMPTY_LABEL_HTML;
}

function setCvFile(file) {
  const zone = document.getElementById('cv-zone');
  const label = document.getElementById('cv-label');
  if (!zone || !label) return;
  const fileError = validateResumeFile(file);
  if (fileError) {
    resetCvFileUi();
    showApplyError(fileError);
    return;
  }
  zone.classList.add('has-file');
  label.innerHTML = `<span class="cv-upload-filename">📄 ${escHtml(file.name)}</span><br><span style="font-size:11px;color:#6b7280">${Math.round(file.size / 1024)} KB</span>`;
}

function syncCvUiFromInput() {
  const input = document.getElementById('cv-file');
  const file = input?.files?.[0];
  if (file) {
    setCvFile(file);
  } else {
    resetCvFileUi();
  }
}

function setupScrollTopButton() {
  const button = document.getElementById('scroll-top-btn');
  if (!button) return;

  const updateVisibility = () => {
    button.classList.toggle('is-visible', window.scrollY > 280);
  };

  button.addEventListener('click', () => {
    window.scrollTo({
      top: 0,
      behavior: prefersReducedMotion ? 'auto' : 'smooth',
    });
  });

  window.addEventListener('scroll', updateVisibility, { passive: true });
  updateVisibility();
}

function openCvPicker() {
  const input = document.getElementById('cv-file');
  if (!input) return;
  pendingCvPickerSync = true;
  input.click();
}

function handleCvSelect(event) {
  pendingCvPickerSync = false;
  const file = event.target.files[0];
  if (file) {
    setCvFile(file);
  } else {
    resetCvFileUi();
  }
}

function handleCvDrop(event) {
  event.preventDefault();
  const zone = document.getElementById('cv-zone');
  if (zone) zone.classList.remove('drag-over');
  const file = event.dataTransfer.files[0];
  if (!file) return;
  const fileError = validateResumeFile(file);
  if (fileError) {
    showApplyError(fileError);
    return;
  }
  const dataTransfer = new DataTransfer();
  dataTransfer.items.add(file);
  document.getElementById('cv-file').files = dataTransfer.files;
  pendingCvPickerSync = false;
  setCvFile(file);
}

window.addEventListener('focus', () => {
  if (!pendingCvPickerSync) return;
  window.setTimeout(() => {
    pendingCvPickerSync = false;
    syncCvUiFromInput();
  }, 0);
});

async function submitApplication() {
  if (!currentJob) return;

  const fullName = document.getElementById('apply-name')?.value.trim();
  const email = document.getElementById('apply-email')?.value.trim();
  const phone = document.getElementById('apply-phone')?.value.trim();
  const cvFile = document.getElementById('cv-file')?.files?.[0];
  const answers = Array.from(document.querySelectorAll('.screening-answer')).map(input => ({
    index: Number(input.dataset.questionIndex),
    answer: input.value.trim(),
  }));

  if (!fullName) return showApplyError('נא למלא שם מלא');
  if (!email || !email.includes('@')) return showApplyError('נא למלא כתובת אימייל תקינה');
  if (!phone) return showApplyError('נא למלא מספר טלפון');
  if (answers.some(item => !item.answer)) return showApplyError('נא למלא את כל השאלות');

  if (!noResumeMode) {
    const fileError = validateResumeFile(cvFile);
    if (fileError) return showApplyError(fileError);
  }

  const button = document.getElementById('apply-btn');
  button.disabled = true;
  button.textContent = '⏳ שולח...';
  showJobLoader(
    noResumeMode ? 'שולחים את המועמדות' : 'מעלים את קורות החיים',
    noResumeMode ? 'רק עוד רגע והמועמדות שלך בפנים' : 'רק עוד רגע והקובץ בדרך אלינו'
  );

  try {
    const formData = new FormData();
    formData.append('job_uuid', currentJob.uuid);
    formData.append('job_number', currentJob.job_number);
    formData.append('position_id', currentJob.position_id || '');
    formData.append('full_name', fullName);
    formData.append('email', email);
    formData.append('phone', phone);
    formData.append('screening_answers', JSON.stringify(answers));
    formData.append('noresume', noResumeMode ? 'true' : 'false');

    if (!noResumeMode && cvFile) {
      formData.append('cv', cvFile);
    }

    const response = await fetch(`${API}/applications`, {
      method: 'POST',
      body: formData,
    });

    const result = await response.json();
    if (!response.ok || !result.success) {
      throw new Error(result.message || 'שליחת המועמדות נכשלה');
    }

    showApplySuccess('מועמדותך התקבלה בהצלחה! נחזור אליך בהקדם.');
    button.textContent = 'נשלח בהצלחה ✓';
    hideJobLoader();
  } catch (error) {
    button.disabled = false;
    button.textContent = 'שלח מועמדות →';
    hideJobLoader();
    showApplyError(error.message || 'שליחת המועמדות נכשלה');
  }
}

async function loadJob() {
  if (!jobNumber) {
    renderError('חסר פרמטר n בכתובת המשרה.');
    return;
  }

  try {
    const response = await fetch(`${API}/jobs/by-number/${encodeURIComponent(jobNumber)}`);
    const result = await response.json();
    if (!response.ok || !result.success || !result.data) {
      const error = new Error(result.message || 'המשרה לא נמצאה');
      error.responseStatus = response.status;
      error.result = result;
      throw error;
    }
    renderJob(result.data);
  } catch (error) {
    if (shouldRenderInactiveJobState(error, error?.responseStatus, error?.result)) {
      renderInactiveJobState(error?.message || 'המשרה כבר לא פעילה או הוסרה מהאתר');
      return;
    }
    renderError(error.message || 'המשרה לא נמצאה');
  }
}

loadJob();
setupScrollTopButton();
setupIOSBrandIconSway('.job-footer-logo');
</script>
</body>
</html>
